<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIDI + Audio to XM Converter</title>
    <style>
        body { font-family: sans-serif; background-color: #282a36; color: #f8f8f2; padding: 2em; }
        h1 { color: #50fa7b; }
        .container { max-width: 800px; margin: auto; background-color: #44475a; padding: 2em; border-radius: 8px; }
        label { display: block; margin-top: 1em; color: #8be9fd; }
        input, button { width: 100%; padding: 10px; margin-top: 0.5em; border-radius: 4px; border: none; }
        button { background-color: #bd93f9; color: white; font-weight: bold; cursor: pointer; margin-top: 1.5em; }
        button:hover { background-color: #ff79c6; }
        #log { margin-top: 1em; background-color: #282a36; padding: 1em; border-radius: 4px; white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h1>MIDI + Audio to XM Converter</h1>
        <p>Upload a MIDI file and the audio samples you want to use for each track.</p>

        <label for="midi-file">1. Upload your MIDI file:</label>
        <input type="file" id="midi-file" accept=".mid,.midi">

        <label for="audio-files">2. Upload your audio samples (WAV, MP3, etc.):</label>
        <input type="file" id="audio-files" accept="audio/*" multiple>

        <button id="generate-btn">Generate .XM File</button>

        <div id="log">Logs will appear here...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/midi-file@1.2.3/dist/index.min.js"></script>
    <script src="src/App.jsx"></script>
</body>
</html>
