function decodeUTF32(uint8Array, isLittleEndian = true) {
  const dataView = new DataView(uint8Array.buffer);
  let result = "";
  for (let i = 0; i < uint8Array.length; i += 4) {
    let codePoint;
    if (isLittleEndian) {
      codePoint = dataView.getUint32(i, true); // Little-endian
    } else {
      codePoint = dataView.getUint32(i, false); // Big-endian
    }
    result += String.fromCodePoint(codePoint);
  }
  return result;
}
xhr.onload = function() {

    <script>
        // --- DOM Elements ---

        const notesContainer = document.getElementById('notes-container');
        const notesReadout = document.getElementById('notes-readout');
        const waveformCtx = waveformCanvas.getContext('2d');
        const timelineCtx = timelineCanvas.getContext('2d');
        const cursorCtx = cursorCanvas.getContext('2d');

        // --- Audio and 3D Variables ---
        let audioContext, analyser, audioBufferSourceNode, javascriptNode;
        let scene, camera, renderer, noteObjects = [];
        let fontData, waveformData;
        
        // --- Note and Playback Data ---
        const noteStrings = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
        let recordedNotes = [], instrument;

        // --- Application State ---
        let isAnalyzing = false, animationFrameId, decodedAudioBuffer;
        let isPlaybackActive = false, cursorAnimationFrameId;

        // --- Event Listeners ---
        startBtn.addEventListener('click', () => startAnalysis(false));
        offlineProcessBtn.addEventListener('click', () => startAnalysis(true));
        stopBtn.addEventListener('click', stopAnalysis);
        playbackBtn.addEventListener('click', playRecording);
        stopPlaybackBtn.addEventListener('click', stopPlayback);
        octaveSelect.addEventListener('change', () => { if (recordedNotes.length > 0) drawNotation(); });
        speedSlider.addEventListener('input', () => { speedValue.textContent = `${parseFloat(speedSlider.value).toFixed(1)}x`; });
        sensitivitySlider.addEventListener('input', () => { sensitivityValue.textContent = sensitivitySlider.value; });
        boostSlider.addEventListener('input', () => { boostValue.textContent = `${parseFloat(boostSlider.value).toFixed(1)}x`; });
        slowdownSlider.addEventListener('input', () => { slowdownValue.textContent = `${slowdownSlider.value}x`; });
        audioFileInput.addEventListener('change', () => { decodedAudioBuffer = null; });
        window.addEventListener('resize', onWindowResize, false);

        // --- Initialization ---
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, noteCanvas.clientWidth / noteCanvas.clientHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ canvas: noteCanvas, antialias: true, alpha: true });
            renderer.setSize(noteCanvas.clientWidth, noteCanvas.clientHeight);
            renderer.setClearColor(0x000000, 0); 
            camera.position.z = 10;
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
            directionalLight.position.set(0, 1, 1);
            scene.add(directionalLight);
        }

        // --- Note Detection Logic ---
        function detectNoteFromFrequencyData(freqArray, sampleRate, fftSize, sensitivity) {
             let maxVal = 0, maxIndex = 0;
            for (let i = 0; i < freqArray.length; i++) {
                if (freqArray[i] > maxVal) { maxVal = freqArray[i]; maxIndex = i; }
            }
            if (maxVal > sensitivity) { 
                const frequency = maxIndex * sampleRate / fftSize;
                if (frequency === 0) return null;
                const midiNote = Math.round(12 * (Math.log(frequency / 440) / Math.log(2))) + 69;
                return { midi: midiNote, name: noteStrings[midiNote % 12] };
            }
            return null;
        }

        function midiToNoteName(midi) {
            const octave = Math.floor(midi / 12) - 1;
            return noteStrings[midi % 12] + octave;
        }

        // --- Visualization ---
        function displayNote(noteName) {
            noteObjects.forEach(obj => scene.remove(obj));
            noteObjects = [];
            const textGeometry = new THREE.TextGeometry(noteName, { font: fontData, size: 2, height: 0.5 });
            const textMaterial = new THREE.MeshStandardMaterial({ color: 0x48bb78 });
            const textMesh = new THREE.Mesh(textGeometry, textMaterial);
            textGeometry.computeBoundingBox();
            textMesh.position.x = -(textGeometry.boundingBox.max.x - textGeometry.boundingBox.min.x) / 2;
            textMesh.position.y = -1;
            scene.add(textMesh);
            noteObjects.push(textMesh);
        }

        function drawWaveform() {
            if(!isAnalyzing || !analyser) return;
            analyser.getByteTimeDomainData(waveformData);
            waveformCtx.fillStyle = '#2d3748';
            waveformCtx.fillRect(0, 0, waveformCanvas.width, waveformCanvas.height);
            waveformCtx.lineWidth = 2;
            waveformCtx.strokeStyle = '#6366f1';
            waveformCtx.beginPath();
            const sliceWidth = waveformCanvas.width * 1.0 / analyser.frequencyBinCount;
            let x = 0;
            for (let i = 0; i < analyser.frequencyBinCount; i++) {
                const v = waveformData[i] / 128.0;
                const y = v * waveformCanvas.height / 2;
                if (i === 0) waveformCtx.moveTo(x, y); else waveformCtx.lineTo(x, y);
                x += sliceWidth;
            }
            waveformCtx.lineTo(waveformCanvas.width, waveformCanvas.height / 2);
            waveformCtx.stroke();
        }

        function drawTimeline() {
            if (recordedNotes.length === 0) return;

            const w = timelineCanvas.width;
            const h = timelineCanvas.height;
            timelineCtx.fillStyle = '#2d3748';
            timelineCtx.fillRect(0, 0, w, h);

            const minMidi = Math.min(...recordedNotes.map(n => n.midi));
            const maxMidi = Math.max(...recordedNotes.map(n => n.midi));
            const totalDuration = recordedNotes[recordedNotes.length - 1].time;
            const midiRange = maxMidi - minMidi + 1;

            const noteHeight = h / midiRange;

            timelineCtx.strokeStyle = '#4a5568';
            timelineCtx.lineWidth = 1;
            for (let i = 0; i <= midiRange; i++) {
                const y = i * noteHeight;
                timelineCtx.beginPath();
                timelineCtx.moveTo(0, y);
                timelineCtx.lineTo(w, y);
                timelineCtx.stroke();
            }

            timelineCtx.fillStyle = '#81e6d9'; // Teal color for notes
            for (let i = 0; i < recordedNotes.length; i++) {
                const note = recordedNotes[i];
                const nextNote = recordedNotes[i + 1];
                
                const x = (note.time / totalDuration) * w;
                const y = h - ((note.midi - minMidi + 1) * noteHeight);
                
                const duration = nextNote ? nextNote.time - note.time : 0.1;
                const noteWidth = (duration / totalDuration) * w;

                timelineCtx.fillRect(x, y, Math.max(2, noteWidth), noteHeight);
            }
        }
        
        function quantizeNotes(notes) {
            if (notes.length < 2) return [];

            const durations = [];
            for (let i = 0; i < notes.length - 1; i++) {
                const diff = notes[i+1].time - notes[i].time;
                if (diff > 0.01) durations.push(diff);
            }
            if (durations.length === 0) return [];

            durations.sort((a, b) => a - b);
            const medianDuration = durations[Math.floor(durations.length / 2)];
            
            // Heuristic: Assume the median duration is an eighth note
            const eighthNoteTime = medianDuration;
            const quarterNoteTime = eighthNoteTime * 2;
            const sixteenthNoteTime = eighthNoteTime / 2;

            const noteDurations = [
                { duration: "16", time: sixteenthNoteTime },
                { duration: "8", time: eighthNoteTime },
                { duration: "q", time: quarterNoteTime },
                { duration: "h", time: quarterNoteTime * 2 },
                { duration: "w", time: quarterNoteTime * 4 },
            ];

            const quantized = [];
            for (let i = 0; i < notes.length; i++) {
                const currentNote = notes[i];
                const nextNote = notes[i+1];
                const actualDuration = nextNote ? nextNote.time - currentNote.time : eighthNoteTime;

                // Find closest standard duration
                const closest = noteDurations.reduce((prev, curr) => 
                    Math.abs(curr.time - actualDuration) < Math.abs(prev.time - actualDuration) ? curr : prev
                );

                quantized.push({ midi: currentNote.midi, duration: closest.duration });

                // Add rests for long pauses
                if (nextNote) {
                    const gap = nextNote.time - currentNote.time;
                    if (gap > closest.time * 1.8) { // If gap is much larger than the note's duration
                        const restTime = gap - closest.time;
                        // Simplification: add an 8th rest for now. A full implementation would be more complex.
                        if (restTime > eighthNoteTime * 0.8) {
                             quantized.push({ midi: null, duration: "8r" }); // 'r' for rest
                        }
                    }
                }
            }
            return quantized;
        }


        function drawNotation() {
            if (recordedNotes.length < 2) return;
            
            notationOutput.innerHTML = '';
            const { Stave, StaveNote, Formatter, Renderer, Accidental, Voice, Beam } = Vex.Flow;
            
            const octaveShift = parseInt(octaveSelect.value, 10) * 12;
            const quantizedNotes = quantizeNotes(recordedNotes);
            if (quantizedNotes.length === 0) return;
            
            const vexNotes = quantizedNotes.map(qNote => {
                const shiftedMidi = qNote.midi + octaveShift;
                const noteName = noteStrings[shiftedMidi % 12];
                const octave = Math.floor(shiftedMidi / 12) - 1;
                
                let keys;
                let duration = qNote.duration;

                if (qNote.midi === null) { // This is a rest
                    keys = ["b/4"]; // VexFlow needs a key for rests, it's placed on the middle line
                } else {
                    keys = [`${noteName.toLowerCase().replace('#', '')}/${octave}`];
                }

                const staveNote = new StaveNote({ keys: keys, duration: duration });
                if (qNote.midi !== null && noteName.includes('#')) {
                    staveNote.addModifier(new Accidental("#"));
                }
                return staveNote;
            });

            const renderer = new Renderer(notationOutput, Renderer.Backends.SVG);
            const context = renderer.getContext();
            
            const beatsPerMeasure = 4;
            const measures = [];
            let currentMeasure = [];
            let currentMeasureTicks = 0;
            const ticksPerMeasure = 4096 * beatsPerMeasure;

            for (const note of vexNotes) {
                const noteTicks = note.getTicks().value();
                if (currentMeasureTicks + noteTicks > ticksPerMeasure && currentMeasure.length > 0) {
                    measures.push(currentMeasure);
                    currentMeasure = [note];
                    currentMeasureTicks = noteTicks;
                } else {
                    currentMeasure.push(note);
                    currentMeasureTicks += noteTicks;
                }
            }
            if (currentMeasure.length > 0) measures.push(currentMeasure);
            
            const notationHeight = 200;
            const totalWidth = 250 * measures.length + 100;
            renderer.resize(totalWidth, notationHeight);
            cursorCanvas.width = totalWidth;
            cursorCanvas.height = notationHeight;
            context.setFont('Arial', 10).setBackgroundFillStyle('#FFFFFF');

            let x = 10;
            for (const measureNotes of measures) {
                if (measureNotes.length === 0) continue;
                const stave = new Stave(x, 40, 250);
                if (x === 10) stave.addClef('treble').addTimeSignature('4/4');
                stave.setContext(context).draw();
                
                const voice = new Voice({ num_beats: beatsPerMeasure, beat_value: 4 });
                voice.setStrict(false);
                voice.addTickables(measureNotes);
                
                const beams = Beam.generateBeams(measureNotes.filter(n => !n.isRest()));
                
                new Formatter().joinVoices([voice]).format([voice], 200);
                
                voice.draw(context, stave);
                beams.forEach(beam => beam.setContext(context).draw());
                
                x += stave.getWidth();
            }
        }

        function drawCursorLoop() {
            if (!isPlaybackActive) {
                cursorCtx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);
                return;
            }
            const speed = 1 / parseFloat(speedSlider.value);
            const currentTime = Tone.Transport.seconds / speed;
            const totalDuration = recordedNotes[recordedNotes.length - 1]?.time || 1;
            const totalWidth = cursorCanvas.width;

            const x = (currentTime / totalDuration) * totalWidth;

            cursorCtx.clearRect(0, 0, totalWidth, cursorCanvas.height);
            cursorCtx.strokeStyle = 'rgba(255, 0, 0, 0.7)';
            cursorCtx.lineWidth = 2;
            cursorCtx.beginPath();
            cursorCtx.moveTo(x, 0);
            cursorCtx.lineTo(x, cursorCanvas.height);
            cursorCtx.stroke();
            
            cursorAnimationFrameId = requestAnimationFrame(drawCursorLoop);
        }

        function animate() {
            animationFrameId = requestAnimationFrame(animate);
            if (isAnalyzing) drawWaveform();
            if(renderer) renderer.render(scene, camera);
        }

        // --- Analysis Flow ---
        async function startAnalysis(isSilent = false) {
            if (isAnalyzing) return;
            const file = audioFileInput.files[0];
            if (!file) { showMessage("Please select an audio file first."); return; }
            
            setUIState('analyzing', isSilent);
            recordedNotes = [];
            notesReadout.textContent = '';
            timelineCtx.clearRect(0, 0, timelineCanvas.width, timelineCanvas.height);
            notationOutput.innerHTML = '';


            try {
                if (!decodedAudioBuffer) {
                    showMessage("Decoding audio file...");
                    const arrayBuffer = await file.arrayBuffer();
                    if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    decodedAudioBuffer = await audioContext.decodeAudioData(arrayBuffer);
                }
                
                if (isSilent) {
                    await processOffline(decodedAudioBuffer);
                } else {
                    processRealtime(decodedAudioBuffer);
                }
            } catch (err) {
                 showMessage("Error processing audio file. It may be corrupted.");
                 console.error(err);
                 setUIState('idle');
            }
        }

        function processRealtime(buffer) {
            showMessage("Analyzing in real-time...");
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') audioContext.resume();
            
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            waveformData = new Uint8Array(analyser.frequencyBinCount);

            javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);
            javascriptNode.connect(audioContext.destination);
            analyser.connect(javascriptNode);

            let recordingStartTime = 0;
            javascriptNode.onaudioprocess = (event) => {
                const freqArray = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(freqArray);
                const note = detectNoteFromFrequencyData(freqArray, audioContext.sampleRate, analyser.fftSize, parseInt(sensitivitySlider.value, 10));
                if(note) {
                    displayNote(note.name);
                    const time = audioContext.currentTime - recordingStartTime;
                    const lastNote = recordedNotes[recordedNotes.length - 1];
                    if (!lastNote || (note.midi !== lastNote.midi) || (time - lastNote.time > 0.05)) {
                         recordedNotes.push({ midi: note.midi, time: time });
                    }
                }
            };
            
            audioBufferSourceNode = audioContext.createBufferSource();
            audioBufferSourceNode.buffer = buffer;
            audioBufferSourceNode.connect(analyser);
            audioBufferSourceNode.connect(audioContext.destination);
            audioBufferSourceNode.onended = onAnalysisEnd;
            
            recordingStartTime = audioContext.currentTime;
            audioBufferSourceNode.start(0);
            isAnalyzing = true;
        }

        async function processOffline(buffer) {
            showMessage("Processing silently...");
            const slowdown = parseFloat(slowdownSlider.value);
            const offlineCtx = new OfflineAudioContext(buffer.numberOfChannels, buffer.duration * buffer.sampleRate * slowdown, buffer.sampleRate);
            
            const source = offlineCtx.createBufferSource();
            source.buffer = buffer;
            source.playbackRate.value = 1 / slowdown;

            const gainNode = offlineCtx.createGain();
            gainNode.gain.value = parseFloat(boostSlider.value);

            const offlineAnalyser = offlineCtx.createAnalyser();
            offlineAnalyser.fftSize = 2048;

            const scp = offlineCtx.createScriptProcessor(2048, buffer.numberOfChannels, buffer.numberOfChannels);

            source.connect(gainNode);
            gainNode.connect(offlineAnalyser);
            offlineAnalyser.connect(scp);
            scp.connect(offlineCtx.destination);

            let lastMidi = null;
            scp.onaudioprocess = (event) => {
                const freqArray = new Uint8Array(offlineAnalyser.frequencyBinCount);
                offlineAnalyser.getByteFrequencyData(freqArray);
                const note = detectNoteFromFrequencyData(freqArray, offlineCtx.sampleRate, offlineAnalyser.fftSize, parseInt(sensitivitySlider.value, 10));
                
                const time = event.playbackTime / slowdown;
                
                if(note && note.midi !== lastMidi) {
                    recordedNotes.push({ midi: note.midi, time: time });
                    lastMidi = note.midi;
                }
                const progress = event.playbackTime / (buffer.duration * slowdown);
                progressBar.style.width = `${Math.min(progress * 100, 100)}%`;
            };

            source.start(0);
            isAnalyzing = true;
            await offlineCtx.startRendering();
            isAnalyzing = false;
            onAnalysisEnd();
        }

        function stopAnalysis() {
            if (!isAnalyzing || !audioBufferSourceNode) return;
            audioBufferSourceNode.stop(0);
        }

        function onAnalysisEnd() {
            isAnalyzing = false;
            if (recordedNotes.length > 0) {
                const notesText = recordedNotes.map(note => midiToNoteName(note.midi)).join(' ');
                notesReadout.textContent = notesText;
                drawTimeline();
                drawNotation();
                showMessage(`Analysis complete. ${recordedNotes.length} notes recorded.`);
            } else {
                 showMessage("Analysis finished. No notes were detected.");
            }
            setUIState('finished');
            waveformCtx.fillStyle = '#2d3748';
            waveformCtx.fillRect(0, 0, waveformCanvas.width, waveformCanvas.height);
        }

        // --- Playback Logic ---
        async function playRecording() {
            if (recordedNotes.length === 0) { showMessage("No notes to play."); return; }
            await Tone.start();
            stopPlayback(); 
            setUIState('playing');
            showMessage("Preparing instrument...");
            try {
                instrument = await createInstrument(instrumentSelect.value);
            } catch (error) {
                showMessage("Error: Could not create instrument."); console.error(error);
                setUIState('finished'); return;
            }
            showMessage("Playing back notes...");
            const speed = 1 / parseFloat(speedSlider.value);
            const octaveShift = parseInt(octaveSelect.value, 10) * 12;
            
            recordedNotes.forEach(note => {
                const shiftedMidi = note.midi + octaveShift;
                const noteName = midiToNoteName(shiftedMidi);
                const scheduledTime = note.time * speed;
                instrument.triggerAttackRelease(noteName, "8n", scheduledTime);
            });

            isPlaybackActive = true;
            drawCursorLoop();

            const lastNoteTime = recordedNotes[recordedNotes.length - 1]?.time || 0;
            const totalDuration = lastNoteTime * speed;
            Tone.Transport.scheduleOnce(() => {
                showMessage("Playback finished.");
                stopPlayback();
            }, totalDuration + 0.5);
            Tone.Transport.start();
        }

        function stopPlayback() {
            if (!isPlaybackActive && Tone.Transport.state !== 'started') return;
            Tone.Transport.stop();
            Tone.Transport.cancel(0);
            isPlaybackActive = false;
            if(cursorAnimationFrameId) cancelAnimationFrame(cursorAnimationFrameId);
            cursorCtx.clearRect(0, 0, cursorCanvas.width, cursorCanvas.height);
            setUIState('finished');
            showMessage("Playback stopped.");
        }
        
        // --- Instrument Creation ---
        async function createInstrument(instrumentName) {
            if (instrument) instrument.dispose();
            switch (instrumentName) {
                case 'piano':
                    return new Tone.PolySynth(Tone.Synth, {
                        oscillator: { type: "triangle" },
                        envelope: { attack: 0.005, decay: 0.1, sustain: 0.3, release: 1 }
                    }).toDestination();
                case 'flute':
                     return new Tone.AMSynth({
                        harmonicity: 2.5,
                        detune: 0,
                        oscillator: { type: "sine" },
                        envelope: { attack: 0.05, decay: 0.4, sustain: 0.4, release: 1.4 },
                        modulation: { type: "triangle" },
                        modulationEnvelope: { attack: 0.2, decay: 0.01, sustain: 1, release: 0.5 }
                    }).toDestination();
                case 'synth':
                default:
                    return new Tone.Synth().toDestination();
            }
        }
        
        // --- UI State Management ---
        function setUIState(state, isSilent = false) {
            startBtn.classList.add('hidden');
            offlineProcessBtn.classList.add('hidden');
            stopBtn.classList.add('hidden');
            playbackBtn.classList.add('hidden');
            stopPlaybackBtn.classList.add('hidden');
            playbackControls.classList.add('hidden');
            progressBarContainer.classList.add('hidden');
            notesContainer.classList.add('hidden');
            timelineContainer.classList.add('hidden');
            notationContainer.classList.add('hidden');


            if (state === 'idle') {
                startBtn.classList.remove('hidden');
                offlineProcessBtn.classList.remove('hidden');
            } else if (state === 'analyzing') {
                stopBtn.classList.remove('hidden');
                if(isSilent) progressBarContainer.classList.remove('hidden');
            } else if (state === 'finished') {
                startBtn.classList.remove('hidden');
                offlineProcessBtn.classList.remove('hidden');
                if (recordedNotes.length > 0) {
                    playbackBtn.classList.remove('hidden');
                    playbackControls.classList.remove('hidden');
                    notesContainer.classList.remove('hidden');
                    timelineContainer.classList.remove('hidden');
                    notationContainer.classList.remove('hidden');
                }
            } else if (state === 'playing') {
                stopPlaybackBtn.classList.remove('hidden');
                playbackControls.classList.remove('hidden');
                notesContainer.classList.remove('hidden');
                timelineContainer.classList.remove('hidden');
                notationContainer.classList.remove('hidden');
            }
        }

        function showMessage(message) { messageBox.textContent = message; }

        // --- Utility Functions ---
        function onWindowResize() {
            if (renderer) {
                camera.aspect = noteCanvas.clientWidth / noteCanvas.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(noteCanvas.clientWidth, noteCanvas.clientHeight);
            }
            waveformCanvas.width = waveformCanvas.clientWidth;
            timelineCanvas.width = timelineCanvas.clientWidth;
            waveformCanvas.height = waveformCanvas.clientHeight;
            timelineCanvas.height = timelineCanvas.clientHeight;
            if(recordedNotes.length > 0) {
                drawTimeline();
                drawNotation();
            }
        }

        function loadFontAndStart() {
            const loader = new THREE.FontLoader();
            loader.load('https://raw.githubusercontent.com/mrdoob/three.js/dev/examples/fonts/helvetiker_regular.typeface.json', (font) => {
                fontData = font;
                onWindowResize();
                if (!animationFrameId) animate();
            });
        }
        
        // Initial setup
        setUIState('idle');
        showMessage("Select an audio file and choose an analysis method.");
        loadFontAndStart();
    </script>
