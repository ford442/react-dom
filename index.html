
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React libopenmpt Note Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/index.css">
  <script>
    window.GEMINI_API_KEY = "YOUR_API_KEY_HERE";
  </script>
</head>
<body class="bg-gray-900 text-gray-200">
  <div id="root"></div>
  
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "@google/genai": "https://esm.sh/@google/genai@0.10.0"
      }
    }
  </script>

  <script type="module" src="/index.tsx"></script>
  
  <!--
    FIX: Define the libopenmpt configuration object BEFORE the script loads.
    This prevents the script from overwriting our onRuntimeInitialized callback.
    A promise is used to signal readiness to the React application.
  -->
  <script>
    window.libopenmptReady = new Promise(resolve => {
      window.libopenmpt = {
        onRuntimeInitialized: function() {
          console.log('libopenmpt runtime initialized via pre-load script.');
          // 'this' is the fully initialized module object.
          resolve(this);
        }
      };
    });
  </script>
  <script src="https://wasm.noahcohn.com/libmpt/libopenmptjs.js"></script>
</body>
</html>
